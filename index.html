<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="description" content="ASCEND OS — Build Yourself. Every Day. Your complete Life Operating System." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ASCEND OS</title>
    <style>
      /* Splash screen: shown instantly from HTML/CSS before React hydrates,
         so there is zero blank-screen flash on cold start. */
      html, body { background: #0D0D0D; margin: 0; }
      #splash {
        position: fixed; inset: 0; background: #0D0D0D; z-index: 9999;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        transition: opacity 0.5s ease;
      }
      #splash svg { width: 72px; height: 72px; animation: ascend-rise 1.1s ease-out infinite alternate; }
      #splash p { color: #8A8A93; font-family: system-ui, sans-serif; letter-spacing: 0.3em; font-size: 11px; margin-top: 18px; text-transform: uppercase; }
      @keyframes ascend-rise { from { transform: translateY(2px); opacity: 0.7; } to { transform: translateY(-4px); opacity: 1; } }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 78 L38 40 L52 58 L68 32 L92 78 Z" stroke="#E11D48" stroke-width="4" stroke-linejoin="round" fill="none"/>
        <path d="M68 14 L68 40 M68 14 L58 24 M68 14 L78 24" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p>ASCEND OS</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 550); }
        }, 700);
      });
    </script>
  </body>
</html>
